# constat:template id=go-coverage-mutation-workflow version=80 sha256=6fb99c1cca2a460cf8093ed1857a78c4ccaecb8a810e29effd12fbf6716be8a5
name: constat-ci-coverage-mutation
# Generated by DoneMark's onboarding pull request. Publishes exactly the catalog entries this
# repository's CI did not already publish (see @constat/evidence's EVIDENCE_CATALOG) — the third
# proof (line coverage) and/or the fourth (mutation), whichever this repository was missing. It
# never touches constat-ci.yml or any job already publishing the check report: this file is
# additive, on purpose, so a repository catching up loses nothing it already had.
on:
  pull_request:
jobs:
  coverage:
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # Best-effort by design: a single test file's coverage run failing must not take down every
      # OTHER check's coverage comparison — the program names it there and carries on.
      - run: go run .github/scripts/constat-go-coverage.go .constat/check-coverage/coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: constat-check-coverage
          path: .constat/check-coverage/coverage.json
          if-no-files-found: error

  mutation:
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MUTATION_MAX_MUTANTS: 6
      MUTATION_BUDGET_SECONDS: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go run .github/scripts/constat-go-mutation.go "${{ github.base_ref }}" .constat/check-mutation/mutation.json
      - if: always()
        run: |
          git status --porcelain
          git checkout -- .
      - uses: actions/upload-artifact@v4
        with:
          name: constat-check-report-mutation
          path: .constat/check-mutation/mutation.json
          if-no-files-found: error

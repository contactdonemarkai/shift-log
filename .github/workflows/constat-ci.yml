# constat:template id=go-ci-workflow version=80 sha256=f8d07008f18809dc79a69785868bc2e3c77844d76b34345b842c9d3a59ee0891
name: constat-ci
# Generated by DoneMark's onboarding pull request. Runs this project's Go suite with
# "go test -json" — Go's own machine-readable record of a run — turns it into the per-check report
# DoneMark's collector reads by name (see .github/scripts/constat-go-report.go), and publishes it,
# plus a second run of the same suite against the code as it was before the change.
on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - id: tests
        env:
          SKIP_CLAUDE_INTEGRATION: '1'
          SKIP_CODEX_INTEGRATION: '1'
          SKIP_GEMINI_INTEGRATION: '1'
          SKIP_OPENCODE_INTEGRATION: '1'
          SKIP_COPILOT_INTEGRATION: '1'
        run: |
          mkdir -p .constat/check-report
          go test -json ./... > .constat/check-report/raw.json
      - if: always() && steps.tests.conclusion != 'skipped'
        run: go run .github/scripts/constat-go-report.go .constat/check-report/raw.json .constat/check-report/checks.json
      - if: always() && steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-check-report
          path: .constat/check-report/checks.json
          if-no-files-found: error
      # The pictures those checks took, from the SAME run as the report: DoneMark reads pictures only
      # from the run that carried the check report. An empty folder is fine — not every commit has a
      # visual criterion, and a service may never have one at all.
      - if: always() && steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-pictures
          path: .constat/pictures/
          if-no-files-found: ignore

  base-comparison:
    needs: test
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name != 'master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: head-report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: constat-check-report
          path: .constat/head-report
      - if: steps.head-report.outcome != 'success'
        run: |
          echo "::warning::the test job published no constat-check-report, so there is nothing to" \
               "compare against; publishing no before-code report. DoneMark will read every" \
               "criterion as passed-but-unproven, which is the honest degradation."
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - id: rewind
        if: steps.head-report.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash .github/scripts/constat-rewind-to-base.sh "${{ github.base_ref || 'master' }}"
      - id: base-tests
        if: steps.rewind.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p .constat/check-report
          go test -json ./... > .constat/check-report/raw.json
      - if: always() && steps.base-tests.conclusion != 'skipped'
        run: |
          go run .github/scripts/constat-go-report.go \
            .constat/check-report/raw.json .constat/check-report-base/checks.json \
            --expected .constat/head-report/checks.json
      - if: always() && steps.base-tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-check-report-base
          path: .constat/check-report-base/checks.json
          if-no-files-found: error
